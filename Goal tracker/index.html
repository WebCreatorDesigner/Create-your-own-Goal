<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Goal Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.95);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --secondary: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center; 
            padding: 1rem;
            margin: 0;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 1.5rem; 
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 450px; 
            max-height: 85vh; 
            overflow-y: auto; 
            position: relative;
        }

        .card::-webkit-scrollbar { width: 6px; }
        .card::-webkit-scrollbar-track { background: transparent; }
        .card::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 4px; }
        .card::-webkit-scrollbar-thumb:hover { background: #475569; }

        h1 { margin-top: 0; font-size: 1.5rem; }
        h2 { margin-top: 0; font-size: 1.2rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 1.2rem; font-size: 0.9rem; margin-top: -0.5rem;}
        
        .hidden { display: none !important; }

        /* Forms and Inputs */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        
        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--secondary);
            background-color: #0f172a;
            color: white;
            font-size: 0.9rem;
            min-width: 120px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, opacity 0.2s;
            width: 100%;
            font-size: 0.9rem;
        }

        button:hover { opacity: 0.9; }
        
        .btn-inline { width: auto; flex: 1; }
        .btn-secondary { background-color: var(--secondary); margin-top: 1rem;}
        .btn-secondary:hover { background-color: #475569; }
        .btn-small { padding: 0.3rem 0.8rem; font-size: 0.8rem; width: auto; background-color: var(--secondary); }
        
        /* Subtle Reset Button */
        .btn-reset { 
            background: transparent; 
            color: var(--text-muted); 
            font-size: 0.75rem; 
            padding: 0; 
            margin-top: 1.5rem; 
            width: auto;
            text-decoration: underline;
            font-weight: normal;
        }
        .btn-reset:hover { color: #ef4444; background: transparent; }

        /* Settings Button & Modal */
        .settings-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            width: auto;
            padding: 0.5rem;
            font-size: 1.2rem;
            color: var(--text-muted);
            z-index: 10;
        }
        .settings-btn:hover { color: white; background: transparent; }

        .settings-panel {
            background-color: #0f172a;
            border: 1px solid var(--secondary);
            padding: 1.2rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        /* Progress Bar */
        .progress-container {
            background-color: var(--secondary);
            border-radius: 8px;
            height: 24px;
            width: 100%;
            margin: 0.5rem 0 1rem 0;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }

        .milestone-marker {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background-color: rgba(255, 255, 255, 0.6);
            z-index: 2;
            cursor: pointer;
        }
        
        .milestone-marker:hover::after {
            content: attr(data-title);
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        /* Discrete Add Progress Tool */
        .quick-add-container {
            margin-bottom: 1.5rem;
            text-align: right;
        }
        
        .quick-add-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 0;
            width: auto;
            text-decoration: underline;
        }
        .quick-add-toggle:hover { color: var(--text); background: none; }

        .discrete-add {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 6px;
        }
        .discrete-add input {
            width: 80px; 
            min-width: 80px;
            padding: 0.4rem;
            font-size: 0.85rem;
            text-align: center;
            background: rgba(15, 23, 42, 0.5);
        }
        .discrete-add button {
            width: auto;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        /* Milestones List */
        .milestone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            border-top: 1px solid var(--secondary);
            padding-top: 1.5rem;
        }
        
        .add-milestone-form {
            background: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px solid var(--secondary);
        }

        .milestone-list {
            list-style: none;
            padding: 0;
            margin-top: 1rem;
        }

        .milestone-item {
            background: var(--secondary);
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .milestone-item.achieved {
            border-left: 4px solid var(--success);
            opacity: 0.7;
        }
        
        .achieved-badge {
            color: var(--success);
            font-size: 0.75rem;
            font-weight: bold;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .milestone-desc {
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-top: 4px;
            line-height: 1.3;
        }

        @media (max-width: 480px) {
            .card { width: 95%; padding: 1.2rem; }
            .input-group { flex-direction: column; }
            .btn-inline { width: 100%; }
        }
    </style>
</head>
<body>

<div class="card">
    <button class="settings-btn" onclick="toggleSettings()" title="Settings">⚙️</button>

    <!-- SETTINGS PANEL -->
    <div id="settings-panel" class="settings-panel hidden">
        <h2>Settings</h2>
        <div class="setting-row">
            <label>Theme Color:</label>
            <input type="color" id="theme-color" value="#4f46e5" onchange="updateThemeColor(this.value)" style="width: 100%; height: 35px; padding: 0;">
        </div>
        <div class="setting-row">
            <label>Background Image:</label>
            <input type="file" id="bg-upload" accept="image/*" onchange="handleBackgroundUpload(event)">
        </div>
        <button class="btn-secondary" style="padding: 0.4rem; font-size: 0.8rem;" onclick="clearBackground()">Remove Background</button>
        <button style="margin-top: 1rem; padding: 0.4rem; font-size: 0.8rem;" onclick="toggleSettings()">Close</button>
    </div>
    
    <!-- STEP 1: Set Goal -->
    <div id="step-1">
        <h1>Step 1: Set a Goal</h1>
        <p class="subtitle">What are you working towards?</p>
        <div class="input-group">
            <input type="text" id="goal-name" placeholder="Goal Name (e.g., Save for PC parts)">
        </div>
        <div class="input-group">
            <input type="text" id="goal-desc" placeholder="Brief description / motivation (Optional)">
        </div>
        <div class="input-group">
            <input type="number" id="goal-target" placeholder="Target Number (e.g., 500)">
        </div>
        <button style="margin-top: 0.5rem;" onclick="goToStep2()">Next: Add Milestones →</button>
    </div>

    <!-- STEP 2: Add Milestones -->
    <div id="step-2" class="hidden">
        <h1>Step 2: Milestones</h1>
        <p class="subtitle" id="step-2-subtitle">Break your goal down.</p>
        <div class="input-group" style="flex-direction: row;">
            <input type="text" id="setup-milestone-name" placeholder="Milestone name" style="flex: 2;">
            <input type="number" id="setup-milestone-target" placeholder="Target #" style="flex: 1;">
        </div>
        <div class="input-group" style="flex-direction: row;">
            <input type="text" id="setup-milestone-desc" placeholder="Description (Optional)" style="flex: 3;">
            <button class="btn-inline" onclick="addSetupMilestone()" style="flex: 1;">Add</button>
        </div>
        <ul class="milestone-list" id="setup-milestones-list"></ul>
        <button onclick="finishSetup()" style="margin-top: 1rem;">Finish & View Dashboard ✓</button>
        <button class="btn-secondary" onclick="backToStep1()">← Back</button>
    </div>

    <!-- STEP 3: Main Dashboard -->
    <div id="step-3" class="hidden">
        <h1 id="display-goal-name">Goal Name</h1>
        <p class="subtitle" id="display-goal-desc"></p>
        
        <div class="stats-row">
            <span id="display-progress-text">0 / 0</span>
            <span id="display-percentage" style="font-weight: bold; color: var(--text);">0%</span>
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="main-progress-bar"></div>
            <div id="progress-markers"></div>
        </div>

        <!-- Toggleable Quick Add -->
        <div class="quick-add-container">
            <button class="quick-add-toggle" onclick="toggleQuickAdd()">+ Quick add</button>
            <div id="quick-add-box" class="discrete-add hidden">
                <input type="number" id="add-amount" placeholder="Amount">
                <button onclick="addProgress()">Add</button>
            </div>
        </div>

        <!-- Milestones Header & Inline Add Button -->
        <div class="milestone-header">
            <h2 style="margin: 0; padding: 0; border: none;">Milestones</h2>
            <button class="btn-small" onclick="toggleAddDashboardMilestone()">+ Add</button>
        </div>

        <!-- Hidden Form to Add New Milestone from Dashboard -->
        <div id="dashboard-add-milestone" class="add-milestone-form hidden">
            <div class="input-group" style="flex-direction: row;">
                <input type="text" id="dash-milestone-name" placeholder="Name" style="flex: 2;">
                <input type="number" id="dash-milestone-target" placeholder="Target #" style="flex: 1;">
            </div>
            <div class="input-group" style="flex-direction: row; margin-bottom: 0;">
                <input type="text" id="dash-milestone-desc" placeholder="Desc (Opt)" style="flex: 3;">
                <button class="btn-inline" onclick="addDashboardMilestone()" style="flex: 1; background-color: var(--primary);">Save</button>
            </div>
        </div>

        <ul class="milestone-list" id="dashboard-milestones"></ul>

        <div style="text-align: center;">
            <button class="btn-reset" onclick="resetGoal()">Delete Goal & Start Over</button>
        </div>
    </div>
</div>

<script>
    // --- SETTINGS MANAGEMENT ---
    let appSettings = JSON.parse(localStorage.getItem('myGoalSettings')) || {
        primaryColor: '#4f46e5',
        bgImage: ''
    };

    function toggleSettings() {
        document.getElementById('settings-panel').classList.toggle('hidden');
    }

    function applySettings() {
        document.documentElement.style.setProperty('--primary', appSettings.primaryColor);
        document.getElementById('theme-color').value = appSettings.primaryColor;
        
        if (appSettings.bgImage) {
            document.body.style.backgroundImage = `url(${appSettings.bgImage})`;
        } else {
            document.body.style.backgroundImage = 'none';
        }
    }

    function updateThemeColor(color) {
        appSettings.primaryColor = color;
        localStorage.setItem('myGoalSettings', JSON.stringify(appSettings));
        applySettings();
    }

    function handleBackgroundUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                appSettings.bgImage = e.target.result;
                localStorage.setItem('myGoalSettings', JSON.stringify(appSettings));
                applySettings();
            };
            reader.readAsDataURL(file);
        }
    }

    function clearBackground() {
        appSettings.bgImage = '';
        document.getElementById('bg-upload').value = '';
        localStorage.setItem('myGoalSettings', JSON.stringify(appSettings));
        applySettings();
    }

    applySettings();

    // --- GOAL TRACKER LOGIC ---
    let goalData = JSON.parse(localStorage.getItem('myGoalData'));
    let tempData = { name: '', desc: '', target: 0, current: 0, milestones: [] };

    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const step3 = document.getElementById('step-3');
    
    function init() {
        if (goalData && goalData.isSetupComplete) {
            showStep(3);
            updateDashboard();
        } else {
            showStep(1);
        }
    }

    function showStep(stepNumber) {
        step1.classList.add('hidden');
        step2.classList.add('hidden');
        step3.classList.add('hidden');
        document.getElementById('settings-panel').classList.add('hidden');
        
        if (stepNumber === 1) step1.classList.remove('hidden');
        if (stepNumber === 2) step2.classList.remove('hidden');
        if (stepNumber === 3) step3.classList.remove('hidden');
    }

    // --- STEP 1 ---
    function goToStep2() {
        const name = document.getElementById('goal-name').value;
        const desc = document.getElementById('goal-desc').value;
        const target = parseFloat(document.getElementById('goal-target').value);
        
        if (!name || isNaN(target) || target <= 0) {
            alert("Please enter a valid name and a target number greater than 0.");
            return;
        }

        tempData.name = name;
        tempData.desc = desc;
        tempData.target = target;
        document.getElementById('step-2-subtitle').textContent = `Add milestones up to ${target}.`;
        showStep(2);
    }

    // --- STEP 2 ---
    function backToStep1() { showStep(1); }

    function addSetupMilestone() {
        const nameInput = document.getElementById('setup-milestone-name');
        const descInput = document.getElementById('setup-milestone-desc');
        const targetInput = document.getElementById('setup-milestone-target');
        
        const mName = nameInput.value;
        const mDesc = descInput.value;
        const mTarget = parseFloat(targetInput.value);

        if (!mName || isNaN(mTarget) || mTarget <= 0 || mTarget > tempData.target) {
            alert(`Enter a valid name and a target number between 1 and ${tempData.target}.`);
            return;
        }

        tempData.milestones.push({ name: mName, desc: mDesc, target: mTarget });
        tempData.milestones.sort((a, b) => a.target - b.target);

        nameInput.value = ''; descInput.value = ''; targetInput.value = '';
        renderSetupMilestones();
    }

    function renderSetupMilestones() {
        const list = document.getElementById('setup-milestones-list');
        list.innerHTML = '';
        
        if (tempData.milestones.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); font-size: 0.85rem; padding: 10px 0;">No milestones added yet.</li>';
            return;
        }

        tempData.milestones.forEach(m => {
            const li = document.createElement('li');
            li.className = 'milestone-item';
            
            const descHtml = m.desc ? `<div class="milestone-desc">${m.desc}</div>` : '';
            
            li.innerHTML = `
                <div style="flex: 1;">
                    <strong>${m.name}</strong>
                    ${descHtml}
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">Target: ${m.target}</div>
            `;
            list.appendChild(li);
        });
    }

    function finishSetup() {
        tempData.isSetupComplete = true;
        goalData = { ...tempData }; 
        localStorage.setItem('myGoalData', JSON.stringify(goalData));
        init();
    }

    // --- STEP 3 (DASHBOARD) ---
    function toggleQuickAdd() {
        const box = document.getElementById('quick-add-box');
        box.classList.toggle('hidden');
        if (!box.classList.contains('hidden')) {
            document.getElementById('add-amount').focus();
        }
    }

    function addProgress() {
        const amountInput = document.getElementById('add-amount');
        const amount = parseFloat(amountInput.value);
        if (isNaN(amount) || amount <= 0) return;

        goalData.current += amount;
        if (goalData.current > goalData.target) goalData.current = goalData.target;

        amountInput.value = '';
        toggleQuickAdd(); // Hide box after adding
        localStorage.setItem('myGoalData', JSON.stringify(goalData));
        updateDashboard();
    }
    
    function toggleAddDashboardMilestone() {
        document.getElementById('dashboard-add-milestone').classList.toggle('hidden');
    }

    function addDashboardMilestone() {
        const nameInput = document.getElementById('dash-milestone-name');
        const descInput = document.getElementById('dash-milestone-desc');
        const targetInput = document.getElementById('dash-milestone-target');
        
        const mName = nameInput.value;
        const mDesc = descInput.value;
        const mTarget = parseFloat(targetInput.value);

        if (!mName || isNaN(mTarget) || mTarget <= 0 || mTarget > goalData.target) {
            alert(`Enter a valid name and a target number between 1 and ${goalData.target}.`);
            return;
        }

        goalData.milestones.push({ name: mName, desc: mDesc, target: mTarget });
        goalData.milestones.sort((a, b) => a.target - b.target);

        nameInput.value = ''; descInput.value = ''; targetInput.value = '';
        toggleAddDashboardMilestone();
        
        localStorage.setItem('myGoalData', JSON.stringify(goalData));
        updateDashboard();
    }

    function updateDashboard() {
        if (!goalData) return;

        document.getElementById('display-goal-name').textContent = goalData.name;
        
        const descEl = document.getElementById('display-goal-desc');
        if (goalData.desc) {
            descEl.textContent = goalData.desc;
            descEl.classList.remove('hidden');
        } else {
            descEl.classList.add('hidden');
        }

        document.getElementById('display-progress-text').textContent = `${goalData.current} / ${goalData.target}`;
        
        const percent = Math.min((goalData.current / goalData.target) * 100, 100);
        const displayPercent = percent % 1 === 0 ? percent : percent.toFixed(1);
        document.getElementById('display-percentage').textContent = `${displayPercent}%`;
        document.getElementById('main-progress-bar').style.width = percent + '%';

        const markersContainer = document.getElementById('progress-markers');
        markersContainer.innerHTML = '';
        
        goalData.milestones.forEach(m => {
            const mPercent = (m.target / goalData.target) * 100;
            if (mPercent <= 100) {
                const marker = document.createElement('div');
                marker.className = 'milestone-marker';
                marker.style.left = mPercent + '%';
                marker.setAttribute('data-title', `${m.name} (${m.target})`);
                markersContainer.appendChild(marker);
            }
        });

        const container = document.getElementById('dashboard-milestones');
        container.innerHTML = '';

        if (goalData.milestones.length === 0) {
            container.innerHTML = '<li style="color: var(--text-muted); font-size: 0.85rem;">No milestones set.</li>';
        }

        goalData.milestones.forEach(m => {
            const isAchieved = goalData.current >= m.target;
            const li = document.createElement('li');
            li.className = `milestone-item ${isAchieved ? 'achieved' : ''}`;
            
            const listPercent = Math.min((goalData.current / m.target) * 100, 100);
            const descHtml = m.desc ? `<div class="milestone-desc">${m.desc}</div>` : '';
            
            li.innerHTML = `
                <div style="flex: 1; padding-right: 10px;">
                    <strong>${m.name}</strong><br>
                    <span style="font-size: 0.75rem; color: var(--text-muted);">Target: ${m.target}</span>
                    ${descHtml}
                </div>
                ${isAchieved ? '<span class="achieved-badge">✓ REACHED</span>' : `
                <div style="text-align: right; color: #94a3b8; font-size: 0.85rem; min-width: 40px;">
                    ${Math.round(listPercent)}%
                </div>`}
            `;
            container.appendChild(li);
        });
    }

    function resetGoal() {
        if (confirm("Are you sure you want to delete this goal and all progress?")) {
            localStorage.removeItem('myGoalData');
            goalData = null;
            tempData = { name: '', desc: '', target: 0, current: 0, milestones: [] };
            
            document.getElementById('goal-name').value = '';
            document.getElementById('goal-desc').value = '';
            document.getElementById('goal-target').value = '';
            document.getElementById('setup-milestones-list').innerHTML = '';
            
            init();
        }
    }

    init();
</script>

</body>
</html>
